name: stats

on:
  schedule:
    - cron: "30 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Berbagi grup dengan build.yml agar dua commit otomatis tidak saling menimpa.
concurrency:
  group: build-assets
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install "fonttools[woff]" brotli pillow pyyaml

      # Token hanya menaikkan rate limit REST; bila gagal, stats.json lama dipakai.
      - name: Fetch GitHub stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/fetch_stats.py

      - name: Build assets and README
        run: python tools/build.py

      - name: Test
        run: python -m unittest

      - name: Commit refreshed stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stats.json assets README.md
          if git diff --cached --quiet; then
            echo "tidak ada perubahan"
          else
            git commit -m "Perbarui statistik GitHub"
            git pull --rebase origin main
            git push
          fi
