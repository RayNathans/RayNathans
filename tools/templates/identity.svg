<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 {{height}}" width="100%" role="img" aria-label="about.json dan lima fakta tentang {{name}}">
<style>
{{style}}
.cur{animation:cursor 1s steps(1) infinite}
@keyframes cursor{50%{opacity:0}}
.ln{opacity:0;animation:show .3s ease-out forwards}
@keyframes show{to{opacity:1}}
.fact{opacity:0;animation:show .5s ease-out forwards}
.scan{animation:scan 4s linear infinite}
@keyframes scan{from{transform:translateY(-30px)}to{transform:translateY({{height}}px)}}
.pulse-line{animation:pl 2.4s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){.ln,.fact{opacity:1!important}}
</style>
<defs>
  <linearGradient id="scan" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#00e5ff" stop-opacity="0"/><stop offset="1" stop-color="#00e5ff" stop-opacity=".12"/></linearGradient>
  <clipPath id="left"><rect x="0" y="0" width="716" height="{{height}}"/></clipPath>
</defs>
<rect width="1200" height="{{height}}" fill="#0d1117"/>
<!-- terminal -->
<rect x=".5" y=".5" width="715" height="{{panel_h}}" fill="#0a0f24" stroke="#15214a"/>
<rect x="1" y="1" width="714" height="34" fill="#070b1c"/>
<circle cx="18" cy="18" r="5" fill="#ff5f57"/><circle cx="36" cy="18" r="5" fill="#febc2e"/><circle cx="54" cy="18" r="5" fill="#28c840"/>
<text x="72" y="23" class="mono" font-size="12" fill="#7f93c4">nathan@github: ~/about.json</text>
<text x="700" y="23" text-anchor="end" class="mono" font-size="10" fill="#7f93c4" letter-spacing="1">JSONC</text>
<g clip-path="url(#left)"><rect class="scan" x="1" y="35" width="714" height="30" fill="url(#scan)"/></g>
<g class="mono" font-size="14">
{{lines}}
</g>
<!-- fakta -->
<rect x="736.5" y=".5" width="463" height="{{panel_h}}" fill="#0a0f24" stroke="#15214a"/>
<path d="M737 12 L737 1 L748 1" fill="none" stroke="#00e5ff" stroke-width="2"/>
<path d="M1199 {{corner_y}} L1199 {{panel_h}} L1188 {{panel_h}}" fill="none" stroke="#00e5ff" stroke-width="2"/>
<text x="756" y="24" class="mono" font-size="11" fill="#7f93c4" letter-spacing="2">// QUICK FACTS</text>
<line x1="756" y1="34" x2="1180" y2="34" stroke="#15214a"/>
{{facts}}
</svg>
