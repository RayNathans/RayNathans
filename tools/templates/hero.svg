<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" role="img" aria-label="Nikolaus Ray Nathan, Full Stack Developer">
<style>
{{style}}
.sky{fill:url(#sky)}
.win{animation:blink 2.6s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:.95}50%{opacity:.12}}
.neon{animation:flicker 3.4s linear infinite}
@keyframes flicker{0%,18%,22%,25%,53%,57%,100%{opacity:1}20%,24%,55%{opacity:.25}}
.dot{animation:pulse 1.6s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.6)}}
.rain line{stroke:#00e5ff;stroke-linecap:round;animation:rain 1.2s linear infinite}
@keyframes rain{from{transform:translateY(-80px)}to{transform:translateY(440px)}}
.g1{animation:glitch1 3.2s steps(1) infinite}
.g2{animation:glitch2 3.2s steps(1) infinite}
@keyframes glitch1{0%,100%{clip-path:inset(100% 0 0 0);transform:none}
 4%{clip-path:inset(12% 0 68% 0);transform:translate(-3px,0)}
 6%{clip-path:inset(60% 0 12% 0);transform:translate(3px,0)}
 8%{clip-path:inset(30% 0 40% 0);transform:translate(-2px,0)}
 10%{clip-path:inset(100% 0 0 0);transform:none}
 62%{clip-path:inset(45% 0 30% 0);transform:translate(3px,0)}
 64%{clip-path:inset(5% 0 80% 0);transform:translate(-3px,0)}
 66%{clip-path:inset(100% 0 0 0);transform:none}}
@keyframes glitch2{0%,100%{clip-path:inset(100% 0 0 0);transform:none}
 4%{clip-path:inset(70% 0 10% 0);transform:translate(3px,0)}
 6%{clip-path:inset(20% 0 60% 0);transform:translate(-3px,0)}
 8%{clip-path:inset(85% 0 0 0);transform:translate(2px,0)}
 10%{clip-path:inset(100% 0 0 0);transform:none}
 62%{clip-path:inset(10% 0 70% 0);transform:translate(-3px,0)}
 64%{clip-path:inset(55% 0 25% 0);transform:translate(3px,0)}
 66%{clip-path:inset(100% 0 0 0);transform:none}}
.typed{clip-path:inset(0 100% 0 0);animation:typing 7s steps(6,end) infinite}
@keyframes typing{0%{clip-path:inset(0 100% 0 0)}12%,88%{clip-path:inset(0 0 0 0)}92%,100%{clip-path:inset(0 100% 0 0)}}
.cur{animation:cursor 1s steps(1) infinite}
@keyframes cursor{50%{opacity:0}}
.out1{opacity:0;animation:show1 7s linear infinite}
.out2{opacity:0;animation:show2 7s linear infinite}
@keyframes show1{0%,16%{opacity:0}19%,88%{opacity:1}92%,100%{opacity:0}}
@keyframes show2{0%,30%{opacity:0}33%,88%{opacity:1}92%,100%{opacity:0}}
.scan{animation:scan 2.4s ease-in-out infinite alternate}
@keyframes scan{from{transform:translateY(-66px)}to{transform:translateY(66px)}}
.drone{animation:hover 3s ease-in-out infinite}
@keyframes hover{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.holo-glow{animation:hglow 2.8s ease-in-out infinite}
@keyframes hglow{0%,100%{opacity:.35}50%{opacity:.7}}
</style>
<defs>
  <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#03040d"/><stop offset=".7" stop-color="#070b24"/><stop offset="1" stop-color="#0c1440"/></linearGradient>
  <linearGradient id="bld" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#0b1540"/><stop offset="1" stop-color="#03061a"/></linearGradient>
  <linearGradient id="bld2" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#101d5c"/><stop offset="1" stop-color="#050a26"/></linearGradient>
  <linearGradient id="floorfade" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".35" stop-color="#fff" stop-opacity=".6"/><stop offset="1" stop-color="#fff" stop-opacity="1"/></linearGradient>
  <mask id="floormask"><rect x="0" y="300" width="1200" height="100" fill="url(#floorfade)"/></mask>
  <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#2f6bff" stop-opacity=".55"/><stop offset="1" stop-color="#2f6bff" stop-opacity="0"/></radialGradient>
  <radialGradient id="mglow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ff2bd6" stop-opacity=".35"/><stop offset="1" stop-color="#ff2bd6" stop-opacity="0"/></radialGradient>
  <clipPath id="hex"><polygon points="960,113 1022,149 1022,221 960,257 898,221 898,149"/></clipPath>
  <clipPath id="floorclip"><rect x="0" y="300" width="1200" height="100"/></clipPath>
  <filter id="neonf" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>

<rect class="sky" width="1200" height="400"/>
<ellipse cx="960" cy="200" rx="260" ry="190" fill="url(#glow)"/>
<ellipse cx="300" cy="260" rx="300" ry="120" fill="url(#mglow)"/>

<!-- skyline jauh -->
<g fill="#071030" opacity=".95">
  <rect x="0" y="230" width="60" height="170"/><rect x="70" y="200" width="40" height="200"/><rect x="120" y="250" width="80" height="150"/><rect x="210" y="190" width="50" height="210"/>
  <rect x="270" y="240" width="70" height="160"/><rect x="350" y="170" width="45" height="230"/><rect x="405" y="225" width="90" height="175"/><rect x="505" y="205" width="55" height="195"/>
  <rect x="570" y="245" width="75" height="155"/><rect x="655" y="185" width="40" height="215"/><rect x="705" y="235" width="85" height="165"/><rect x="800" y="210" width="50" height="190"/>
  <rect x="860" y="250" width="70" height="150"/><rect x="940" y="180" width="45" height="220"/><rect x="995" y="230" width="90" height="170"/><rect x="1095" y="200" width="55" height="200"/><rect x="1160" y="240" width="40" height="160"/>
</g>
<circle class="win" cx="372" cy="166" r="3" fill="#ef4444"/><circle class="win" cx="962" cy="176" r="3" fill="#ef4444" style="animation-delay:-1.5s"/>

<!-- gedung dekat + jendela -->
{{buildings}}
{{windows}}

<!-- papan neon -->
<g class="neon" filter="url(#neonf)">
  <rect x="618" y="250" width="124" height="22" fill="none" stroke="#ff2bd6" stroke-width="1.5"/>
  <text x="680" y="266" text-anchor="middle" class="orb" font-size="12" fill="#ff2bd6" letter-spacing="3">LARAVEL</text>
</g>
<g class="neon" style="animation-delay:-1.3s" filter="url(#neonf)">
  <rect x="1104" y="206" width="92" height="20" fill="none" stroke="#00e5ff" stroke-width="1.5"/>
  <text x="1150" y="220" text-anchor="middle" class="orb" font-size="10" fill="#00e5ff" letter-spacing="2">NEXT.JS</text>
</g>

<!-- lantai grid -->
<g mask="url(#floormask)">
  <rect x="0" y="300" width="1200" height="100" fill="#050a22"/>
  <g stroke="#2f6bff" stroke-width="1" opacity=".55">
    <line x1="600" y1="300" x2="-400" y2="400"/><line x1="600" y1="300" x2="-100" y2="400"/><line x1="600" y1="300" x2="150" y2="400"/><line x1="600" y1="300" x2="380" y2="400"/>
    <line x1="600" y1="300" x2="600" y2="400"/><line x1="600" y1="300" x2="820" y2="400"/><line x1="600" y1="300" x2="1050" y2="400"/><line x1="600" y1="300" x2="1300" y2="400"/><line x1="600" y1="300" x2="1600" y2="400"/>
  </g>
  <g clip-path="url(#floorclip)">
    <g stroke="#00e5ff" stroke-width="1" opacity=".5">
      <line x1="0" y1="300" x2="1200" y2="300"/><line x1="0" y1="312" x2="1200" y2="312"/><line x1="0" y1="324" x2="1200" y2="324"/><line x1="0" y1="336" x2="1200" y2="336"/>
      <line x1="0" y1="348" x2="1200" y2="348"/><line x1="0" y1="360" x2="1200" y2="360"/><line x1="0" y1="372" x2="1200" y2="372"/><line x1="0" y1="384" x2="1200" y2="384"/><line x1="0" y1="396" x2="1200" y2="396"/>
      <animateTransform attributeName="transform" type="translate" from="0 -12" to="0 0" dur="1.1s" repeatCount="indefinite"/>
    </g>
  </g>
</g>
<line x1="0" y1="300" x2="1200" y2="300" stroke="#00e5ff" stroke-width="1.5" opacity=".8" filter="url(#neonf)"/>
<text x="560" y="393" class="mono" font-size="11" fill="#00e5ff" opacity=".85" letter-spacing="2">SBY-07 // SECTOR 2026</text>

<!-- hujan -->
<g class="rain" opacity=".55">
{{rain}}
</g>

<!-- judul -->
<g transform="translate(60,0)">
  <circle class="dot" cx="6" cy="76" r="4" fill="#22c55e"/>
  <text x="18" y="80" class="mono" font-size="12" fill="#7f93c4" letter-spacing="2">SYS.ONLINE</text>
  <g class="orb" font-size="54">
    <text class="g1" x="0" y="140" fill="#00e5ff">NIKOLAUS</text><text class="g1" x="0" y="196" fill="#00e5ff">RAY NATHAN</text>
    <text class="g2" x="0" y="140" fill="#ff2bd6">NIKOLAUS</text><text class="g2" x="0" y="196" fill="#ff2bd6">RAY NATHAN</text>
    <text x="0" y="140" fill="#dbe7ff">NIKOLAUS</text><text x="0" y="196" fill="#00e5ff" filter="url(#neonf)">RAY NATHAN</text>
  </g>
  <text x="2" y="226" class="mono" font-size="15" fill="#7f93c4" letter-spacing="6">FULL STACK DEVELOPER</text>
  <rect x="0" y="244" width="520" height="80" fill="#0a0f24" fill-opacity=".85" stroke="#15214a"/>
  <rect x="0" y="244" width="520" height="2" fill="#00e5ff" opacity=".7"/>
  <g class="mono" font-size="12">
    <text x="12" y="268"><tspan fill="#22c55e">nathan@github</tspan><tspan fill="#7f93c4">:~$ </tspan><tspan class="typed" fill="#dbe7ff">whoami</tspan><tspan class="cur" fill="#00e5ff">_</tspan></text>
    <text class="out1" x="12" y="290" fill="#7f93c4">&gt; loading stack: laravel, next.js, typescript, postgresql <tspan fill="#22c55e">[OK]</tspan></text>
    <text class="out2" x="12" y="312" fill="#7f93c4">&gt; {{term_status}}</text>
  </g>
</g>

<!-- hologram -->
<g>
  <circle class="holo-glow" cx="960" cy="185" r="118" fill="none" stroke="#00e5ff" stroke-width="10" opacity=".4" filter="url(#neonf)"/>
  <circle cx="960" cy="185" r="110" fill="none" stroke="#00e5ff" stroke-width="1.5" stroke-dasharray="40 14 8 14" opacity=".8">
    <animateTransform attributeName="transform" type="rotate" from="0 960 185" to="360 960 185" dur="14s" repeatCount="indefinite"/></circle>
  <circle cx="960" cy="185" r="92" fill="none" stroke="#ff2bd6" stroke-width="1" stroke-dasharray="6 10" opacity=".7">
    <animateTransform attributeName="transform" type="rotate" from="360 960 185" to="0 960 185" dur="10s" repeatCount="indefinite"/></circle>
  <circle cx="960" cy="185" r="76" fill="none" stroke="#2f6bff" stroke-width="2" stroke-dasharray="120 40" opacity=".8">
    <animateTransform attributeName="transform" type="rotate" from="0 960 185" to="360 960 185" dur="18s" repeatCount="indefinite"/></circle>
  <polygon points="960,113 1022,149 1022,221 960,257 898,221 898,149" fill="#0a0f24"/>
  <image href="{{avatar}}" x="890" y="115" width="140" height="140" clip-path="url(#hex)" preserveAspectRatio="xMidYMid slice"/>
  <polygon points="960,113 1022,149 1022,221 960,257 898,221 898,149" fill="#00e5ff" opacity=".16"/>
  <g clip-path="url(#hex)"><rect class="scan" x="890" y="183" width="140" height="4" fill="#00e5ff" opacity=".7"/></g>
  <polygon points="960,113 1022,149 1022,221 960,257 898,221 898,149" fill="none" stroke="#00e5ff" stroke-width="2" filter="url(#neonf)"/>
  <text x="960" y="300" text-anchor="middle" class="mono" font-size="11" fill="#00e5ff" letter-spacing="2">ID: RAY_NATHANS · LVL 24</text>
</g>

<!-- drone -->
<g transform="translate(1080,42)"><g class="drone">
  <rect x="17" y="14" width="20" height="12" rx="3" fill="#0f1b4a" stroke="#00e5ff"/>
  <circle class="dot" cx="27" cy="20" r="3" fill="#ff2bd6"/>
  <line x1="4" y1="12" x2="17" y2="16" stroke="#00e5ff"/><line x1="50" y1="12" x2="37" y2="16" stroke="#00e5ff"/>
  <ellipse cx="4" cy="11" rx="7" ry="2" fill="#00e5ff" opacity=".6"/><ellipse cx="50" cy="11" rx="7" ry="2" fill="#00e5ff" opacity=".6"/>
</g></g>
</svg>
