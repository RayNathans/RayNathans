<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 180" width="100%" role="img" aria-label="End of transmission. Terima kasih sudah mampir.">
<style>
{{style}}
.g1{animation:glitch1 3.6s steps(1) infinite}
.g2{animation:glitch2 3.6s steps(1) infinite}
@keyframes glitch1{0%,100%{clip-path:inset(100% 0 0 0);transform:none}
 5%{clip-path:inset(10% 0 70% 0);transform:translate(-3px,0)}7%{clip-path:inset(60% 0 15% 0);transform:translate(3px,0)}9%{clip-path:inset(100% 0 0 0);transform:none}
 70%{clip-path:inset(40% 0 35% 0);transform:translate(3px,0)}72%{clip-path:inset(100% 0 0 0);transform:none}}
@keyframes glitch2{0%,100%{clip-path:inset(100% 0 0 0);transform:none}
 5%{clip-path:inset(70% 0 10% 0);transform:translate(3px,0)}7%{clip-path:inset(20% 0 60% 0);transform:translate(-3px,0)}9%{clip-path:inset(100% 0 0 0);transform:none}
 70%{clip-path:inset(5% 0 80% 0);transform:translate(-3px,0)}72%{clip-path:inset(100% 0 0 0);transform:none}}
.cur{animation:cursor 1s steps(1) infinite}
@keyframes cursor{50%{opacity:0}}
</style>
<defs>
  <linearGradient id="fade" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity="1"/></linearGradient>
  <mask id="fm"><rect x="0" y="90" width="1200" height="90" fill="url(#fade)"/></mask>
  <clipPath id="fc"><rect x="0" y="90" width="1200" height="90"/></clipPath>
  <filter id="neonf" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <radialGradient id="glow" cx=".5" cy="1" r=".6"><stop offset="0" stop-color="#2f6bff" stop-opacity=".5"/><stop offset="1" stop-color="#2f6bff" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1200" height="180" fill="#03040d"/>
<rect width="1200" height="180" fill="url(#glow)"/>
<g mask="url(#fm)">
  <g stroke="#2f6bff" stroke-width="1" opacity=".55">
    <line x1="600" y1="90" x2="-400" y2="180"/><line x1="600" y1="90" x2="-50" y2="180"/><line x1="600" y1="90" x2="250" y2="180"/><line x1="600" y1="90" x2="450" y2="180"/>
    <line x1="600" y1="90" x2="600" y2="180"/><line x1="600" y1="90" x2="750" y2="180"/><line x1="600" y1="90" x2="950" y2="180"/><line x1="600" y1="90" x2="1250" y2="180"/><line x1="600" y1="90" x2="1600" y2="180"/>
  </g>
  <g clip-path="url(#fc)"><g stroke="#00e5ff" stroke-width="1" opacity=".5">
    <line x1="0" y1="90" x2="1200" y2="90"/><line x1="0" y1="102" x2="1200" y2="102"/><line x1="0" y1="114" x2="1200" y2="114"/><line x1="0" y1="126" x2="1200" y2="126"/>
    <line x1="0" y1="138" x2="1200" y2="138"/><line x1="0" y1="150" x2="1200" y2="150"/><line x1="0" y1="162" x2="1200" y2="162"/><line x1="0" y1="174" x2="1200" y2="174"/><line x1="0" y1="186" x2="1200" y2="186"/>
    <animateTransform attributeName="transform" type="translate" from="0 -12" to="0 0" dur="1.1s" repeatCount="indefinite"/>
  </g></g>
</g>
<line x1="0" y1="90" x2="1200" y2="90" stroke="#00e5ff" stroke-width="1.5" opacity=".8" filter="url(#neonf)"/>
<g class="orb" font-size="34" text-anchor="middle" letter-spacing="4">
  <text class="g1" x="600" y="58" fill="#00e5ff">END OF TRANSMISSION</text>
  <text class="g2" x="600" y="58" fill="#ff2bd6">END OF TRANSMISSION</text>
  <text x="600" y="58" fill="#dbe7ff">END OF TRANSMISSION</text>
</g>
<text x="600" y="80" text-anchor="middle" class="mono" font-size="13" fill="#7f93c4" letter-spacing="1">// thanks for visiting · stay curious · ship clean code<tspan class="cur" fill="#00e5ff">_</tspan></text>
</svg>
