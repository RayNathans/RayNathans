<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 56" width="240" height="56" role="img" aria-label="{{label}}: {{sub}}">
<style>
{{style}}
.glow{animation:glow 2.4s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.35}50%{opacity:.9}}
.shine{animation:shine 3s cubic-bezier(.4,0,.2,1) infinite}
@keyframes shine{0%{transform:translateX(-80px)}60%,100%{transform:translateX(260px)}}
</style>
<defs>
  <linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <clipPath id="box"><rect x="4" y="6" width="232" height="44"/></clipPath>
  <filter id="neonf" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="240" height="56" fill="#0d1117"/>
<rect class="glow" x="4" y="6" width="232" height="44" fill="none" stroke="{{stroke}}" stroke-width="2" filter="url(#neonf)"/>
<rect x="4" y="6" width="232" height="44" fill="{{fill}}" stroke="{{stroke}}" stroke-width="1.5"/>
<g clip-path="url(#box)"><rect class="shine" x="0" y="6" width="60" height="44" fill="url(#sh)" transform="skewX(-20)"/></g>
<path d="M4 16 L4 6 L14 6" fill="none" stroke="#dbe7ff" stroke-width="2"/>
<path d="M236 40 L236 50 L226 50" fill="none" stroke="#dbe7ff" stroke-width="2"/>
<text x="120" y="26" text-anchor="middle" class="orb" font-size="14" fill="{{color}}" letter-spacing="3">{{label}}</text>
<text x="120" y="42" text-anchor="middle" class="mono" font-size="9" fill="{{color}}" opacity=".8">{{sub}}</text>
</svg>
