<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 64" width="100%" role="img" aria-label="{{text}}">
<style>
{{style}}
.cur{animation:cursor 1s steps(1) infinite}
@keyframes cursor{50%{opacity:0}}
.sig{animation:sig 2.2s ease-in-out infinite}
@keyframes sig{0%,100%{opacity:.2}50%{opacity:1}}
</style>
<rect width="1200" height="64" fill="#0d1117"/>
<g class="sig"><rect x="40" y="29" width="4" height="4" fill="#00e5ff"/><rect x="48" y="26" width="4" height="10" fill="#00e5ff"/><rect x="56" y="22" width="4" height="18" fill="#00e5ff"/><rect x="64" y="18" width="4" height="26" fill="#00e5ff"/></g>
<text x="600" y="38" text-anchor="middle" class="mono" font-size="16" fill="#dbe7ff">{{text}}<tspan class="cur" fill="#00e5ff">_</tspan></text>
<g class="sig" style="animation-delay:-1.1s"><rect x="1132" y="18" width="4" height="26" fill="#ff2bd6"/><rect x="1140" y="22" width="4" height="18" fill="#ff2bd6"/><rect x="1148" y="26" width="4" height="10" fill="#ff2bd6"/><rect x="1156" y="29" width="4" height="4" fill="#ff2bd6"/></g>
</svg>
