<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" role="img" aria-label="{{title}}: {{desc_plain}}">
<style>
{{style}}
.pulse-line{animation:pl 2.4s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:1}50%{opacity:.3}}
.blip{animation:blip 1.4s steps(1) infinite}
@keyframes blip{50%{opacity:.2}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.st{animation:st 2.2s ease-in-out infinite}
@keyframes st{0%,100%{opacity:1}50%{opacity:.5}}
.scanb{animation:scanb 3s linear infinite}
@keyframes scanb{from{transform:translateY(-20px)}to{transform:translateY(170px)}}
</style>
<defs>
  <clipPath id="art"><rect x="1" y="1" width="398" height="150"/></clipPath>
  <linearGradient id="artbg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#0a1130"/><stop offset="1" stop-color="#050816"/></linearGradient>
  <linearGradient id="scan" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#00e5ff" stop-opacity="0"/><stop offset="1" stop-color="#00e5ff" stop-opacity=".18"/></linearGradient>
</defs>
<rect width="400" height="300" fill="#0a0f24"/>
<rect x="1" y="1" width="398" height="150" fill="url(#artbg)"/>
<g clip-path="url(#art)">
{{art}}
<rect class="scanb" x="1" y="1" width="398" height="20" fill="url(#scan)"/>
</g>
<line x1="1" y1="151" x2="399" y2="151" stroke="#15214a"/>
<rect x=".5" y=".5" width="399" height="299" fill="none" stroke="#15214a"/>
<path d="M0 14 L0 0 L14 0" fill="none" stroke="#00e5ff" stroke-width="2"/>
<path d="M400 286 L400 300 L386 300" fill="none" stroke="#00e5ff" stroke-width="2"/>
<g class="st"><rect x="{{st_x}}" y="10" width="{{st_w}}" height="18" fill="#03040d" stroke="{{st_color}}"/>
<text x="{{st_tx}}" y="23" text-anchor="middle" class="mono" font-size="10" fill="{{st_color}}" letter-spacing="1">{{status}}</text></g>
<text x="16" y="178" class="orb" font-size="15" fill="#dbe7ff" letter-spacing="1">{{title}}</text>
{{desc}}
{{chips}}
<text x="16" y="286" class="mono" font-size="12" fill="#00e5ff" letter-spacing="1">&gt; LIVE DEMO</text>
<text x="384" y="286" text-anchor="end" class="mono" font-size="10" fill="#7f93c4">{{id_label}}</text>
</svg>
